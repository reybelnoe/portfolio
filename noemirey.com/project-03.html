<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noemi Rey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="about.html">about</a>
    <a href="index.html" class="nav-title">Noemi Rey</a>
    <a href="contact.html">contact</a>
  </nav>

  <main class="project-layout p03">

    <!-- Two separate columns: 6 landscape left, 3 portrait right -->
    <div class="project-thumbs--p03">

      <!-- Left column: 6 × 3:2 landscape -->
      <div class="thumb-col--land">
        <a class="thumb is-landscape active" data-src="assets/project-03/frame_01.jpg" data-ratio="landscape">
          <img src="assets/project-03/frame_01.jpg" alt="">
        </a>
        <a class="thumb is-landscape" data-src="assets/project-03/frame_03.jpg" data-ratio="landscape">
          <img src="assets/project-03/frame_03.jpg" alt="">
        </a>
        <a class="thumb is-landscape" data-src="assets/project-03/frame_04.jpg" data-ratio="landscape">
          <img src="assets/project-03/frame_04.jpg" alt="">
        </a>
        <a class="thumb is-landscape" data-src="assets/project-03/frame_05.jpg" data-ratio="landscape">
          <img src="assets/project-03/frame_05.jpg" alt="">
        </a>
        <a class="thumb is-landscape" data-src="assets/project-03/frame_07.jpg" data-ratio="landscape">
          <img src="assets/project-03/frame_07.jpg" alt="">
        </a>
        <a class="thumb is-landscape" data-src="assets/project-03/frame_08.jpg" data-ratio="landscape">
          <img src="assets/project-03/frame_08.jpg" alt="">
        </a>
      </div>

      <!-- Right column: 3 × 2:3 portrait -->
      <div class="thumb-col--port">
        <a class="thumb is-portrait" data-src="assets/project-03/frame_02.jpg" data-ratio="portrait">
          <img src="assets/project-03/frame_02.jpg" alt="">
        </a>
        <a class="thumb is-portrait" data-src="assets/project-03/frame_06.jpg" data-ratio="portrait">
          <img src="assets/project-03/frame_06.jpg" alt="">
        </a>
        <a class="thumb is-portrait" data-src="assets/project-03/frame_09.jpg" data-ratio="portrait">
          <img src="assets/project-03/frame_09.jpg" alt="">
        </a>
      </div>

    </div>

    <div class="project-spacer"></div>

    <div class="project-featured">
      <div class="featured-box is-landscape" id="featured-box">
        <img id="featured-img" src="assets/project-03/frame_01.jpg" alt="">
      </div>
    </div>

  </main>

  <script src="project.js"></script>
</body>
</html>
